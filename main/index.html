<script>
// Rimosso 'let appData' per evitare conflitti con fetch_cf.js. 
// Usiamo direttamente l'oggetto condiviso su window.
window.appData = window.appData || { nicknames: [], messages: {}, openedDates: [] };
let revealedToday = false;

function todayKey() { return new Date().toISOString().split('T')[0]; }

async function saveData(statusId) {
  // Prepariamo il contenuto prendendolo in modo sicuro da window.appData
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(window.appData, null, 2))));
  
  // Se l'elemento di status non esiste, usiamo un fallback sicuro
  const actualStatusId = document.getElementById(statusId) ? statusId : 'add-status';

  try {
    // CORRETTO: Uso esplicito di window.WORKER_URL
    const res = await fetch(window.WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        content: content,
        sha: window.dataFileSha // CORRETTO: Uso esplicito di window.dataFileSha
      })
    });

    if (!res.ok) throw new Error(await res.text());
    
    const json = await res.json();
    
    // Aggiorna lo SHA globale recuperandolo dalla risposta corretta del Worker
    if (json.content && json.content.sha) {
      window.dataFileSha = json.content.sha;
    } else if (json.sha) {
      window.dataFileSha = json.sha;
    }
    
    if (typeof showStatus === 'function') {
      showStatus(actualStatusId, 'Salvato', 'ok');
    }
  } catch(e) { 
    console.error("Errore Worker:", e);
    if (typeof showStatus === 'function') {
      showStatus(actualStatusId, 'Errore nel salvataggio', 'err'); 
    }
  }
}

function startGlobalTimer() {
  const tick = () => {
    const el = document.getElementById('global-timer');
    if (!el) return;
    const now = new Date();
    const next = new Date(now);
    if (now.getHours() >= 10) next.setDate(next.getDate() + 1);
    next.setHours(10, 0, 0, 0);
    const diff = next - now;
    const h = String(Math.floor(diff / 3600000)).padStart(2,'0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  };
  tick();
  setInterval(tick, 1000);
}

// Rinominata a renderCard per l'HTML, ma agganciata anche a window per fetch_cf.js
function renderCard() {
  const today = todayKey();
  // Usa window.appData
  const todayMsg = (window.appData.messages || {})[today];
  const body = document.getElementById('card-body');
  const overlay = document.getElementById('giftOverlay');

  if (!todayMsg) {
    body.innerHTML = `
      <div style="text-align:center; color:var(--muted); font-size:15px; line-height:1.6">
        Amore se leggi questo non ho messo niente scusami :(<br>Hai il permesso di insultarmi
      </div>`;
    if (overlay) overlay.style.display = 'none';
    return;
  }

  // Messaggio già nel DOM, sotto all'overlay
  body.innerHTML = `<div class="revealed-text">${todayMsg}</div>`;

  // Mostra l'overlay solo se non ancora aperto oggi
  if (!revealedToday && overlay) {
    overlay.style.display = 'block';
  }
}
// Esponiamo la funzione a fetch_cf.js affinché possa chiamarla al termine del caricamento
window.renderAdmin = renderCard; 

function openGift() {
  const overlay = document.getElementById('giftOverlay');
  if (!overlay || overlay.classList.contains('opening')) return;

  overlay.classList.add('opening');
  overlay.onclick = null;

  // Dopo l'animazione dei quadranti, fade out dell'overlay
  setTimeout(() => {
    overlay.classList.add('done');
    revealedToday = true;
    if (!Array.isArray(window.appData.openedDates)) window.appData.openedDates = [];
    if (!window.appData.openedDates.includes(todayKey())) {
      window.appData.openedDates.push(todayKey());
      saveData();
    }
    setTimeout(() => overlay.remove(), 400);
  }, 700);
}
