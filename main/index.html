<script>
// --- CONFIGURAZIONE GLOBALE ---
window.WORKER_URL = "https://ecco-perche-ti-amo.p6kw2n4wh4.workers.dev";
window.dataFileSha = null;
window.appData = { nicknames: [], messages: {}, replies: {}, openedDates: [], theme: {} };
let revealed = false;

function todayKey() { return new Date().toISOString().split('T')[0]; }
function yesterdayKey() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}
function currentDayKey() { return new Date().getHours() >= 10 ? todayKey() : yesterdayKey(); }

// --- CARICAMENTO DATI ---
async function loadData() {
  try {
    const res = await fetch(window.WORKER_URL, { method: 'GET' });

    if (res.status === 404) {
      await createDataFile();
      return;
    }

    const json = await res.json();
    window.dataFileSha = json.sha || (json.content && json.content.sha) || null;

    if (json && json.messages) {
      window.appData = json;
    } else if (json.content && typeof json.content === 'object') {
      window.appData = json.content;
    } else if (json.content && typeof json.content === 'string') {
      try {
        const decoded = decodeURIComponent(escape(atob(json.content.replace(/\s/g, ''))));
        window.appData = JSON.parse(decoded);
      } catch (base64Err) {
        console.error('Errore decodifica Base64:', base64Err);
      }
    }

    if (!window.appData) window.appData = {};
    if (!Array.isArray(window.appData.nicknames)) window.appData.nicknames = [];
    if (typeof window.appData.messages !== 'object' || Array.isArray(window.appData.messages)) window.appData.messages = {};
    if (typeof window.appData.replies !== 'object' || Array.isArray(window.appData.replies)) window.appData.replies = {};
    if (!Array.isArray(window.appData.openedDates)) window.appData.openedDates = [];
    if (typeof window.appData.theme !== 'object' || Array.isArray(window.appData.theme)) window.appData.theme = {};

  } catch (e) {
    console.error('Errore critico nel fetch:', e);
  }
}

async function createDataFile() {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(window.appData, null, 2))));
  try {
    const res = await fetch(window.WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content })
    });
    const json = await res.json();
    window.dataFileSha = json.sha || (json.content && json.content.sha);
  } catch (e) {
    console.warn('Errore durante la creazione del file:', e);
  }
}

async function saveData() {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(window.appData, null, 2))));
  try {
    const res = await fetch(window.WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content, sha: window.dataFileSha })
    });
    if (!res.ok) throw new Error(await res.text());
    const json = await res.json();
    window.dataFileSha = json.sha || (json.content && json.content.sha) || window.dataFileSha;
  } catch (e) {
    console.error('Errore salvataggio Worker:', e);
  }
}

// --- TEMA ---
function applyTheme() {
  const t = (window.appData && window.appData.theme) || {};
  const root = document.documentElement.style;
  const map = {
    bg: '--bg', surface: '--surface', surface2: '--surface2', border: '--border',
    accent: '--accent', accentBg: '--accent-bg', text: '--text', muted: '--muted'
  };
  Object.keys(map).forEach(k => { if (t[k]) root.setProperty(map[k], t[k]); });
}

// --- STREAK ---
function computeCurrentStreak() {
  const opened = new Set(window.appData.openedDates || []);
  let count = 0;
  let cursor = new Date(currentDayKey());
  while (opened.has(cursor.toISOString().split('T')[0])) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

function startGlobalTimer() {
  const tick = () => {
    const el = document.getElementById('global-timer');
    if (!el) return;
    const now = new Date();
    const next = new Date(now);
    if (now.getHours() >= 10) next.setDate(next.getDate() + 1);
    next.setHours(10, 0, 0, 0);
    const diff = next - now;
    const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    el.textContent = `${h}:${m}:${s}`;
  };
  tick();
  setInterval(tick, 1000);
}

function renderStreak() {
  const el = document.getElementById('streak-badge');
  const count = computeCurrentStreak();
  if (count > 0) {
    document.getElementById('streak-count').textContent = count;
    el.style.display = 'inline-flex';
  } else {
    el.style.display = 'none';
  }
}

function renderReplyBox() {
  const day = currentDayKey();
  const card = document.getElementById('reply-card');
  const hasMsg = !!(window.appData.messages || {})[day];
  if (!hasMsg) { card.style.display = 'none'; return; }
  card.style.display = 'flex';

  const row = card.querySelector('.reply-row');
  const sentEl = document.getElementById('reply-sent');
  const existing = (window.appData.replies || {})[day];

  if (existing) {
    row.style.display = 'none';
    sentEl.style.display = 'block';
    sentEl.textContent = `Hai risposto: "${existing}"`;
  } else {
    row.style.display = 'flex';
    sentEl.style.display = 'none';
  }
}

async function sendReply() {
  const input = document.getElementById('reply-input');
  const val = input.value.trim();
  if (!val) return;
  const day = currentDayKey();
  if (!window.appData.replies) window.appData.replies = {};
  window.appData.replies[day] = val;
  input.value = '';
  await saveData();
  renderReplyBox();
}

function renderCard() {
  const day = currentDayKey();
  const msg = (window.appData.messages || {})[day];
  const body = document.getElementById('card-body');
  const overlay = document.getElementById('giftOverlay');

  if (!msg) {
    body.innerHTML = `
      <div style="text-align:center; color:var(--muted); font-size:15px; line-height:1.6">
        Amore se leggi questo non ho messo niente scusami :(<br>Hai il permesso di insultarmi
      </div>`;
    if (overlay) overlay.style.display = 'none';
    return;
  }

  body.innerHTML = `<div class="revealed-text">${msg}</div>`;

  if (!revealed && overlay) {
    overlay.style.display = 'block';
  } else if (overlay) {
    overlay.remove();
  }
}

function openGift() {
  const overlay = document.getElementById('giftOverlay');
  if (!overlay || overlay.classList.contains('opening')) return;

  overlay.classList.add('opening');
  overlay.onclick = null;

  setTimeout(() => {
    overlay.classList.add('done');
    revealed = true;
    if (!Array.isArray(window.appData.openedDates)) window.appData.openedDates = [];
    if (!window.appData.openedDates.includes(currentDayKey())) {
      window.appData.openedDates.push(currentDayKey());
      saveData().then(() => {
        renderStreak();
        renderReplyBox();
      });
    } else {
      renderReplyBox();
    }
    setTimeout(() => overlay.remove(), 400);
  }, 700);
}

// --- APPLICAZIONE LOGICA ALL'AVVIO ---
async function init() {
  await loadData();
  applyTheme();

  if (!Array.isArray(window.appData.openedDates)) window.appData.openedDates = [];
  revealed = window.appData.openedDates.includes(currentDayKey());

  let nicks = ['Amore'];
  if (Array.isArray(window.appData.nicknames) && window.appData.nicknames.length > 0) {
    nicks = window.appData.nicknames;
  }

  document.getElementById('welcome-name').textContent = nicks[Math.floor(Math.random() * nicks.length)];
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

  renderStreak();
  renderCard();
  renderReplyBox();
  startGlobalTimer();
}

window.addEventListener('DOMContentLoaded', init);
</script>
