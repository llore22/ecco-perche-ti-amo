<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="stylesheet" href="s.css">
  <script src="../script/fetch_cf.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>messaggio del giorno</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Per Bea" />
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-greeting">Ei <span id="welcome-name">amoree</span></div>
    <div class="header-date" id="header-date"></div>
  </div>

  <div class="card" id="main-card">
    <!-- Contenuto sempre presente sotto il regalo -->
    <div class="card-body" id="card-body"></div>
    <div class="card-footer">
      <span class="timer-label">Prossimo messaggio tra</span>
      <span class="timer-value" id="global-timer">--:--:--</span>
    </div>

    <!-- Overlay regalo: copre tutta la card, sparisce all'apertura -->
    <div class="gift-overlay" id="giftOverlay" onclick="openGift()">
      <div class="gift-paper tl"></div>
      <div class="gift-paper tr"></div>
      <div class="gift-paper bl"></div>
      <div class="gift-paper br"></div>
      <div class="gift-ribbon-h"></div>
      <div class="gift-ribbon-v"></div>
      <div class="gift-bow">
        <svg viewBox="0 0 80 50" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 28 C30 20, 8 14, 4 22 C0 30, 18 36, 40 28Z" fill="#ff8fab" opacity="0.9"/>
          <path d="M40 28 C50 20, 72 14, 76 22 C80 30, 62 36, 40 28Z" fill="#ff8fab" opacity="0.9"/>
          <path d="M40 25 C32 14, 10 6, 6 14 C2 22, 22 28, 40 25Z" fill="#ffb3c6" opacity="0.9"/>
          <path d="M40 25 C48 14, 70 6, 74 14 C78 22, 58 28, 40 25Z" fill="#ffb3c6" opacity="0.9"/>
          <circle cx="40" cy="26" r="7" fill="#c4637a"/>
          <rect x="37" y="26" width="6" height="18" fill="#c4637a" rx="3"/>
        </svg>
      </div>
      <div class="gift-hint">Tocca per aprire</div>
    </div>
  </div>

  <div class="bottom-row">
    <a class="link-btn" href="../storico/index.html">messaggi passati</a>
  </div>

</div>

<script>
let appData = { nicknames: {}, messages: {} };
let dataFileSha = null;
let revealedToday = false;

function todayKey() { return new Date().toISOString().split('T')[0]; }
function tomorrowKey() { const d = new Date(); d.setDate(d.getDate()+1); return d.toISOString().split('T')[0]; }
function formatDate(str) { const [y,m,d]=str.split('-'); return `${d}/${m}/${y}`; }


// ── TIMER (always on) ────────────────────────────────────────────────
function startGlobalTimer() {
  const tick = () => {
    const el = document.getElementById('global-timer');
    if (!el) return;
    const now = new Date();
    const next = new Date(now);
    if(now.getHours() >= 10)
      next.setDate(next.getDate() + 1);
    next.setHours(10, 0, 0, 0);
    const diff = next - now;
    const h = String(Math.floor(diff / 3600000)).padStart(2,'0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`;
  };
  tick();
  setInterval(tick, 1000);
}

// ── CARD ──────────────────────────────────────────────────────────────

function renderCard() {
  const today = todayKey();
  const todayMsg = (appData.messages || {})[today];
  const body = document.getElementById('card-body');
  const overlay = document.getElementById('giftOverlay');

  if (!todayMsg) {
    body.innerHTML = `
      <div style="text-align:center; color:var(--muted); font-size:15px; line-height:1.6">
        Amore se leggi questo non ho messo niente scusami :(<br>Hai il permesso di insultarmi
      </div>`;
    if (overlay) overlay.style.display = 'none';
    return;
  }

  // Messaggio già nel DOM, sotto all'overlay
  body.innerHTML = `<div class="revealed-text">${todayMsg}</div>`;

  // Mostra l'overlay solo se non ancora aperto oggi
  if (!revealedToday && overlay) {
    overlay.style.display = 'block';
  }
}

function openGift() {
  const overlay = document.getElementById('giftOverlay');
  if (!overlay || overlay.classList.contains('opening')) return;

  overlay.classList.add('opening');
  overlay.onclick = null;

  // Dopo l'animazione dei quadranti, fade out dell'overlay
  setTimeout(() => {
    overlay.classList.add('done');
    revealedToday = true;
    if (!Array.isArray(appData.openedDates)) appData.openedDates = [];
    if (!appData.openedDates.includes(todayKey())) {
      appData.openedDates.push(todayKey());
      saveData();
    }
    setTimeout(() => overlay.remove(), 400);
  }, 700);
}

// ── INIT ──────────────────────────────────────────────────────────────
async function init() {
  await loadData();

  const nicks = appData.nicknames?.length ? appData.nicknames : ['Bea'];
  document.getElementById('welcome-name').textContent = nicks[Math.floor(Math.random() * nicks.length)];
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });
  renderCard();
  startGlobalTimer();
}

init();
</script>
</body>
</html>
