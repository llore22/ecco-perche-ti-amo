<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" type="image/png" href="../heart.png">
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="s.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Statistiche</title>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <a class="back-btn" href="../main/index.html">Indietro</a>
    </div>
    <div style="width:100%;max-width:420px">
      <div class="page-title">Statistiche</div>
    </div>
    <div class="loading" id="loading">Caricamento...</div>
    <div class="stat-grid" id="stat-grid" style="display:none"></div>
  </div>

<script>
window.WORKER_URL = "https://ecco-perche-ti-amo.p6kw2n4wh4.workers.dev";

function applyTheme(appData) {
  const t = (appData && appData.theme) || {};
  const root = document.documentElement.style;
  const map = {
    bg: '--bg', surface: '--surface', surface2: '--surface2', border: '--border',
    accent: '--accent', accentBg: '--accent-bg', text: '--text', muted: '--muted'
  };
  Object.keys(map).forEach(k => { if (t[k]) root.setProperty(map[k], t[k]); });
}

function countWords(messages) {
  return Object.values(messages).reduce((tot, msg) => {
    const words = (msg || '').trim().split(/\s+/).filter(Boolean);
    return tot + words.length;
  }, 0);
}

function mostUsedEmoji(messages) {
  const emojiRegex = /\p{Extended_Pictographic}/gu;
  const counts = {};
  Object.values(messages).forEach(msg => {
    const found = (msg || '').match(emojiRegex) || [];
    found.forEach(e => { counts[e] = (counts[e] || 0) + 1; });
  });
  let best = null, bestCount = 0;
  Object.entries(counts).forEach(([emoji, count]) => {
    if (count > bestCount) { best = emoji; bestCount = count; }
  });
  return best ? `${best} (${bestCount}x)` : '—';
}

function daysUntil(target) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function nextMesiversario() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let target = new Date(today.getFullYear(), today.getMonth(), 22);
  if (target < today) target = new Date(today.getFullYear(), today.getMonth() + 1, 22);
  return target;
}

function nextAnniversario() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let target = new Date(today.getFullYear(), 0, 22);
  if (target < today) target = new Date(today.getFullYear() + 1, 0, 22);
  return target;
}

function formatCountdown(days) {
  if (days === 0) return 'Oggi!';
  if (days === 1) return 'Domani';
  return `${days} giorni`;
}

async function init() {
  let appData = { messages: {} };

  try {
    const res = await fetch(window.WORKER_URL, { method: 'GET' });
    if (res.ok) {
      const json = await res.json();
      if (json && json.messages) appData = json;
      else if (json.content && typeof json.content === 'object') appData = json.content;
      else if (json.content && typeof json.content === 'string') {
        const decoded = decodeURIComponent(escape(atob(json.content.replace(/\s/g, ''))));
        appData = JSON.parse(decoded);
      }
    }
  } catch (e) {
    console.warn('Errore durante il caricamento:', e);
  }

  applyTheme(appData);

  const messages = appData.messages || {};
  const totalMsg = Object.keys(messages).length;
  const totalWords = countWords(messages);
  const topEmoji = mostUsedEmoji(messages);
  const mesiversario = formatCountdown(daysUntil(nextMesiversario()));
  const anniversario = formatCountdown(daysUntil(nextAnniversario()));

  const stats = [
    { value: totalMsg, label: 'Motivi scritti' },
    { value: totalWords, label: 'Parole scritte in totale' },
    { value: topEmoji, label: 'Emoji più usata' },
    { value: mesiversario, label: 'Al prossimo mesiversario' },
    { value: anniversario, label: 'Al prossimo anniversario' }
  ];

  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('stat-grid');
  grid.style.display = 'grid';
  stats.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stat-card';
    el.innerHTML = `<div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>`;
    grid.appendChild(el);
  });
}

init();
</script>
</body>
</html>
